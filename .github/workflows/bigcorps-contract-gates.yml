name: BigCorps · contratos compartilhados
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bigcorps-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-financial-and-routing-gates:
    name: Validações leves (sem build Vercel)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Gates sem instalação de pacotes e sem deploy
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-pix-cancel-boundary.mjs
          node scripts/check-withdrawal-boundary.mjs
          node scripts/check-funcionaria-storefront-card.mjs
          node scripts/check-funcionaria-monthly-direct.mjs
          node scripts/check-funcionaria-ml-import.mjs
          node scripts/check-funcionaria-ml-sync.mjs
          node scripts/check-funcionaria-7k.mjs
          node scripts/check-funcionaria-7l-shared.mjs
          node scripts/check-funcionaria-9a.mjs
          node scripts/check-funcionaria-9b-mobile.mjs
          node scripts/check-funcionaria-9c9e-ux.mjs
          node scripts/check-funcionaria-9f9h-payment-return.mjs
          node scripts/check-funcionaria-9ijk-public-flow.mjs
          node scripts/check-bigcorps-phase10.mjs
          node scripts/check-bigcorps-phase11.mjs
          node scripts/check-bigcorps-phase12.mjs
          node scripts/check-bigcorps-phase13.mjs
          node scripts/test-pix-cancel-capability.cjs
